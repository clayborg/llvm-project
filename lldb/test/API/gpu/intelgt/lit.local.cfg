# IntelGT GPU API tests
# Tests will skip if IntelGT plugin is not available or prerequisites not met

if "lldb-intelgt" not in config.enabled_plugins:
    config.unsupported = True

# Enable GPU debugging via Level Zero
config.environment['ZET_ENABLE_PROGRAM_DEBUGGING'] = '1'

# GPU tests must run sequentially - only one test can access the GPU at a time
config.parallelism_group = 'intelgt-gpu'

# Pass IntelGT log settings through to the spawned lldb-server if set in the
# environment. These are not inherited automatically by the lit subprocess.
import os as _os
for _var in ('LLDB_DEBUGSERVER_LOG_FILE',
             'LLDB_DEBUGSERVER_EXTRA_ARG_1',
             'LLDB_DEBUGSERVER_EXTRA_ARG_2',
             'LLDB_SERVER_LOG_CHANNELS',
             'LD_LIBRARY_PATH',
             'PATH',
             'ONEAPI_DEVICE_SELECTOR',
             'NEO_L0_DebuggerLogBitmask'):
    if _var in _os.environ:
        config.environment[_var] = _os.environ[_var]
