import os
import sys

if "nvgpu" not in config.enabled_plugins:
    config.unsupported = True
else:
    if config.nvgpu_test_ld_library_path:
        config.environment["LD_LIBRARY_PATH"] = config.nvgpu_test_ld_library_path

    config.environment["NVGPU_DISABLE_CPU_STOP_ON_GPU_STOP"] = "1"

    # Find out once per lit run which GPUs this machine has, for the tests that
    # need one: see nvgpu_host.py. This comes before the ASan setup, so that it
    # does not run with the ASan runtime preloaded.
    sys.path.append(
        os.path.join(config.lldb_src_root, "packages/Python/lldbsuite/test/tools/gpu")
    )
    import nvgpu_host

    nvgpu_host.lit_local_config(config, lit_config)

if "Address" in config.llvm_use_sanitizer:
    # AddressSanitizer build: see nvgpu_lit_asan.py for what this sets up.
    sys.path.append(os.path.join(config.lldb_src_root, "test", "API", "gpu"))
    import nvgpu_lit_asan

    nvgpu_lit_asan.configure(config)
